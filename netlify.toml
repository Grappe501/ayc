# Dedicated configuration for the AYC × ArkCAN board proposal branch.
# This file is only changed on proposal/arkcan-board-partnership.
[build]
  publish = "proposal-site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
